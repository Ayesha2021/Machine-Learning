<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>House Price Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
        }

        .content {
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 25px;
            color: #003366;
        }

        p {
            font-size: 18px;
            color: #333;
            margin-bottom: 40px;
        }

        .btn {
            color: white;
            background-color: #003366;
            border: 2px solid #003366;
            padding: 14px 28px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
            cursor: pointer;
        }

        .btn:hover {
            background-color: white;
            color: #003366;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            background-color: #003366;
            color: white;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>🏡 Welcome to the House Price Calculator</h1>
        <p>Estimate the price of a house based on location, size, and more.</p>
        <a href="/about" class="btn">Learn More</a>
        <a href="/predict" class="btn">Get a Prediction</a>
    </div>

    <footer>
        &copy; 2025 House Price Predictor. All rights reserved.
    </footer>
</body>
</html>
