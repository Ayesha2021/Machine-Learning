<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict House Price</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1.heading1 {
            text-align: center;
            color: #003366;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #003366;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #002244;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            color: green;
            font-weight: bold;
        }

        .error {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading1">🏠 House Price Predictor</h1>
        <form method="POST" action="/predict">
            <label for="location">Location:</label>
            <select name="location" required>
                {% set loc = request.form.location %}
                <option value="New York" {% if loc == 'New York' %}selected{% endif %}>New York</option>
                <option value="Phoenix" {% if loc == 'Phoenix' %}selected{% endif %}>Phoenix</option>
                <option value="Chicago" {% if loc == 'Chicago' %}selected{% endif %}>Chicago</option>
                <option value="Los Angeles" {% if loc == 'Los Angeles' %}selected{% endif %}>Los Angeles</option>
                <option value="Houston" {% if loc == 'Houston' %}selected{% endif %}>Houston</option>
            </select>

            <label for="sqft">Square Feet:</label>
            <input type="number" name="sqft" value="{{ request.form.sqft or '' }}" required>

            <label for="beds">Bedrooms:</label>
            <input type="number" name="beds" value="{{ request.form.beds or '' }}" required>

            <label for="baths">Bathrooms:</label>
            <input type="number" name="baths" value="{{ request.form.baths or '' }}" required>

            <label for="year_built">Year Built:</label>
            <input type="number" name="year_built" value="{{ request.form.year_built or '' }}" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction is not none %}
            {% if prediction is string %}
                <div class="error">{{ prediction }}</div>
            {% else %}
                <div class="result">
                    Predicted Price: ${{ "{:,.2f}".format(prediction) }}
                </div>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
